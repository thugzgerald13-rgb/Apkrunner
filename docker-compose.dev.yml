# /docker-compose.dev.yml
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: apkrunner_web_dev
    command: pnpm --filter @apkrunner/web dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_BELLUM_WASM_URL=/wasm/bellum.wasm

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: apkrunner_api_dev
    command: pnpm --filter @apkrunner/api dev
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://apkrunner:apkrunner_password@postgres:5432/apkrunner_db?schema=public
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_APKS=apkrunner-apks
      - S3_BUCKET_ICONS=apkrunner-icons
      - JWT_SECRET=dev_jwt_secret_key_32chars_long_minimum
      - ENABLE_VIRUS_SCAN=false

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  postgres:
    ports:
      - "5432:5432"
